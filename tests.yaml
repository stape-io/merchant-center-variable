  - name: '[Field Mapping] Items Array is modified when the Item ID matches the Item ID in Merchant Center (when using a Custom Item ID Key)'
    code: |-
      mockData.itemIdKey = 'item_sku';
      mockData.map_categories = true;

      mockData.mapping_basic = [
        { merchant_center_variable: 'title', item_variable: 'product_type' }
      ];

      mockData.mapping_custom = [
        { merchant_center_variable: 'description', item_variable: 'description' }
