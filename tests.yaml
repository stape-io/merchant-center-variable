setup: |-
  const encodeUriComponent = require('encodeUriComponent');
  const Promise = require('Promise');
  const JSON = require('JSON');

  const enc = (data) => {
    return encodeUriComponent(data || '');
  };

  const mockData = {
    items: [
      { item_id: '123', item_sku: 'abc', price: 1 },
      { item_id: '456', item_sku: 'def', price: 2.99 },
      { item_id: '789', item_sku: 'ghi', price: 3.5 },
      { item_id: '101', item_sku: 'jkl', price: 0.5 }
    ],
    cache: '12',
    merchant_center_id: '1111111111',
    feed_language: 'en',
    feed_label: 'BR',
    enable_item_match_status: false
  };

  const getNoMatchResponse = () => {
    return {
      statusCode: 404,
      body: {
        error: {
          code: 404,
          message: 'item not found',
          errors: [
            {
              message: 'item not found',
              domain: 'global',
              reason: 'notFound'
            }
          ]
        }
      }
    };
  };

  const getMatchResponse = () => {
    return {
      statusCode: 200,
      body: {
        kind: 'content#product',
        id: 'online:en:BR:',
        offerId: '',
        identifierExists: false,
        title: 'produtinho maravilhoso para voce',
        description:
          'test testtest testtest testtest testtest testtest testtest testtest testtest testtest testtest testtest testtest testtest testtest testtest test',
        link: 'https://example.com/',
        imageLink:
          'https://shopping.googleusercontent.com/image?q=test',
        contentLanguage: 'en',
        targetCountry: 'BR',
        feedLabel: 'BR',
        channel: 'online',
        availability: 'in stock',
        condition: 'new',
        googleProductCategory: '5181',
        price: {
          value: '1.00',
          currency: 'USD'
        },
        productTypes: ['Garden furniture'],
        shipping: [
          {
            country: 'BR'
          }
        ],
        includedDestinations: ['SurfacesAcrossGoogle'],
        customAttributes: [
          {
            name: 'update type',
            value: 'merge'
          }
        ]
      }
    };
  };

  const setSendHttpRequest = (noMatch) => {
    let sendHttpRequestExecutions = 0;

    mock('sendHttpRequest', (requestUrl, requestOptions, requestBody) => {
      const itemIdKey = mockData.itemIdKey ? mockData.itemIdKey : 'item_id';
      const itemId = mockData.items[sendHttpRequestExecutions][itemIdKey];

      let response;

      if (noMatch) {
        response = getNoMatchResponse();
      } else {
        response = getMatchResponse();
        response.body.id += itemId;
        response.body.offerId += itemId;
        response.body.title += itemId;
      }

      sendHttpRequestExecutions++;

      return Promise.create((resolve, reject) => {
        resolve({
          statusCode: response.statusCode,
          body: JSON.stringify(response.body)
        });
      });
    });
  };

  setSendHttpRequest();

  mockObject('templateDataStorage', {
    setItemCopy: (key, value) => {},
    getItemCopy: (key) => {}
  });

  mock('getGoogleAuth', 'expectedGoogleAuth');

tests:
  - name: '[Early Exit] Returns undefined when items is not an array'
    code: |-
      mockData.items = undefined;

      const variableResult = runCode(mockData);

      assertThat(variableResult).isUndefined();
      assertApi('sendHttpRequest').wasNotCalled();

  - name: '[Request URL] Request URL contains required fields (when NOT using a Custom ID Key)'
    code: |-
      runCode(mockData).then(variableResult => {
        mockData.items.forEach(item => {
          const productStringPath =
            mockData.feed_language +
            '~' +
            mockData.feed_label +
            '~' +
            item.item_id;

          const productPath = [
            'accounts',
            enc(mockData.merchant_center_id),
            'products',
            enc(productStringPath)
          ].join('/');

          const expectedUrl =
            'https://merchantapi.googleapis.com/products/v1/' + productPath;

          assertApi('sendHttpRequest').wasCalledWith(
            expectedUrl,
            { method: 'GET', authorization: 'expectedGoogleAuth' }
          );
        });
      });

  - name: '[Request URL] Request URL contains required fields (when using a Custom ID Key)'
    code: |-
      mockData.itemIdKey = 'item_sku';

      runCode(mockData).then(variableResult => {
        mockData.items.forEach(item => {
          let productStringPath =
            mockData.feed_language +
            '~' +
            mockData.feed_label +
            '~' +
            item[mockData.itemIdKey];

          let productPath = [
            'accounts',
            enc(mockData.merchant_center_id),
            'products',
            enc(productStringPath)
          ].join('/');

          let expectedUrl =
            'https://merchantapi.googleapis.com/products/v1/' + productPath;

          assertApi('sendHttpRequest').wasCalledWith(
            expectedUrl,
            { method: 'GET', authorization: 'expectedGoogleAuth' }
          );
        });
      });

  - name: '[Request URL] Encodes product path when Item ID contains special characters'
    code: |-
      mockData.feed_label = 'US';
      mockData.items = [{ item_id: 'sku/123', price: 10 }];

      runCode(mockData).then(variableResult => {
        assertApi('toBase64').wasCalledWith(
          'en~US~sku/123',
          { urlEncoding: true }
        );

        const expectedUrl =
          'https://merchantapi.googleapis.com/products/v1/accounts/1111111111/products/ZW5-VVN-c2t1LzEyMw';

        assertApi('sendHttpRequest').wasCalledWith(
          expectedUrl,
          { method: 'GET', authorization: 'expectedGoogleAuth' }
        );
      });

